services:
  postgres:
    image: postgres:17
    container_name: otter-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop_dev
    ports:
      - "5432:5432"
    volumes:
      - otter_pgdata:/var/lib/postgresql/data
      - ./dev/seed.sql:/docker-entrypoint-initdb.d/001-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop_dev"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  otter_pgdata:
